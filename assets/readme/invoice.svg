<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="inv-title inv-desc">
  <title id="inv-title">Usage Keeper — 消费小票与 Google Colab 算力监控</title>
  <desc id="inv-desc">餐馆小票风格用量发票导出系统与 Google Colab 动态阶梯额度及快照历史监控功能展示。</desc>

  <defs>
    <linearGradient id="inv-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0c"/>
      <stop offset="50%" stop-color="#0e1014"/>
      <stop offset="100%" stop-color="#14171d"/>
    </linearGradient>
    <linearGradient id="card-panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1c22"/>
      <stop offset="100%" stop-color="#131418"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#ffd60a"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>
    <filter id="receipt-drop" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="520" rx="20" fill="url(#inv-bg-grad)" stroke="#272a32" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(56, 40)">
    <rect width="210" height="26" rx="13" fill="#ff9f0a" fill-opacity="0.12" stroke="#ff9f0a" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="14" y="17" fill="#ff9f0a" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">NEW IN V0.11 · FEATURE SHOWCASE</text>
    <text x="0" y="56" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="700" letter-spacing="-0.02em">餐馆风格 Invoice 消费小票 ✕ Google Colab 算力配额</text>
    <text x="0" y="82" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="13">支持自由选择时间段与 TOP N 模型、小费折算、隐私脱敏导出，以及 Colab 阶梯天花板契约与历史快照折线图。</text>
  </g>

  <!-- Left: Authentic Thermal-Paper Invoice Receipt -->
  <g transform="translate(56, 140)">
    <!-- Paper Sheet with shadow -->
    <g filter="url(#receipt-drop)">
      <rect width="360" height="344" rx="8" fill="#fdfdf7"/>
      <!-- Zigzag Tear Bottom Edge -->
      <path d="M 0 344 L 10 352 L 20 344 L 30 352 L 40 344 L 50 352 L 60 344 L 70 352 L 80 344 L 90 352 L 100 344 L 110 352 L 120 344 L 130 352 L 140 344 L 150 352 L 160 344 L 170 352 L 180 344 L 190 352 L 200 344 L 210 352 L 220 344 L 230 352 L 240 344 L 250 352 L 260 344 L 270 352 L 280 344 L 290 352 L 300 344 L 310 352 L 320 344 L 330 352 L 340 344 L 350 352 L 360 344 L 360 344 Z" fill="#fdfdf7"/>
    </g>

    <!-- Receipt Header -->
    <g transform="translate(24, 20)">
      <text x="156" y="16" fill="#1a1a1a" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="0.12em" text-anchor="middle">INVOICE</text>
      <text x="156" y="32" fill="#666666" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10" letter-spacing="0.08em" text-anchor="middle">Usage · 用量账单</text>
      <line x1="0" y1="42" x2="312" y2="42" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>
      
      <!-- Date range -->
      <text x="156" y="56" fill="#333333" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10" text-anchor="middle">2026-08-06 ~ 2026-09-05 (过去 30 天)</text>
      <line x1="0" y1="64" x2="312" y2="64" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>

      <!-- Summary metrics -->
      <g transform="translate(0, 78)" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11">
        <text x="0" y="0" fill="#444444">总请求数</text><text x="312" y="0" fill="#1a1a1a" font-weight="600" text-anchor="end">1.2K</text>
        <text x="0" y="16" fill="#444444">成功请求</text><text x="312" y="16" fill="#1a1a1a" font-weight="600" text-anchor="end">1.2K (99.0%)</text>
        <text x="0" y="32" fill="#444444">总 Tokens</text><text x="312" y="32" fill="#1a1a1a" font-weight="600" text-anchor="end">5.7M</text>
      </g>

      <line x1="0" y1="120" x2="312" y2="120" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="156" y="133" fill="#333333" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="0.08em" text-anchor="middle">TOP 3 模型</text>

      <!-- Table Header -->
      <g transform="translate(0, 148)" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="700" fill="#333333">
        <text x="0" y="0">模型</text>
        <text x="210" y="0" text-anchor="end">Tokens</text>
        <text x="312" y="0" text-anchor="end">费用</text>
        <line x1="0" y1="5" x2="312" y2="5" stroke="#999999" stroke-width="0.8" stroke-dasharray="2 2"/>
      </g>

      <!-- Model Rows -->
      <g transform="translate(0, 168)" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10">
        <text x="0" y="0" fill="#333333">claude-opus-4-6</text><text x="210" y="0" fill="#555555" text-anchor="end">1.5M</text><text x="312" y="0" fill="#1a1a1a" font-weight="600" text-anchor="end">$3.10</text>
        <text x="0" y="15" fill="#333333">gpt-4.5</text><text x="210" y="15" fill="#555555" text-anchor="end">1.0M</text><text x="312" y="15" fill="#1a1a1a" font-weight="600" text-anchor="end">$2.00</text>
        <text x="0" y="30" fill="#333333">deepseek-v4-pro</text><text x="210" y="30" fill="#555555" text-anchor="end">2.0M</text><text x="312" y="30" fill="#1a1a1a" font-weight="600" text-anchor="end">$1.25</text>
        <!-- Gratuity Line (小费) -->
        <line x1="0" y1="36" x2="312" y2="36" stroke="#999999" stroke-width="0.8" stroke-dasharray="2 2"/>
        <text x="0" y="47" fill="#666666" font-style="italic">小费 · 其他</text><text x="210" y="47" fill="#666666" text-anchor="end">1.2M</text><text x="312" y="47" fill="#666666" text-anchor="end">$0.55</text>
      </g>

      <!-- Total Row -->
      <line x1="0" y1="226" x2="312" y2="226" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>
      <g transform="translate(0, 242)" font-family="'SF Mono', ui-monospace, Menlo, monospace">
        <text x="0" y="0" fill="#1a1a1a" font-size="13" font-weight="700">TOTAL 总花费</text>
        <text x="312" y="0" fill="#1a1a1a" font-size="16" font-weight="700" text-anchor="end">$6.90</text>
      </g>

      <!-- Colab Section on Receipt -->
      <line x1="0" y1="252" x2="312" y2="252" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>
      <g transform="translate(0, 268)" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10">
        <text x="0" y="0" fill="#333333">GOOGLE COLAB</text><text x="312" y="0" fill="#30d158" font-weight="700" text-anchor="end">Colab Pro</text>
        <text x="0" y="14" fill="#666666">账号</text><text x="312" y="14" fill="#666666" text-anchor="end">z***6@gmail.com (脱敏)</text>
        <text x="0" y="28" fill="#444444">付费 CCU 余额</text><text x="312" y="28" fill="#1a1a1a" font-weight="700" text-anchor="end">63.16 CCU</text>
      </g>

      <!-- Footer Barcode & Thanks -->
      <line x1="0" y1="306" x2="312" y2="306" stroke="#999999" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="156" y="318" fill="#888888" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8" text-anchor="middle">谢谢惠顾 · 2026-09-05 · ||||||||||||||||</text>
    </g>
  </g>

  <!-- Right: Colab Quota & Ceiling Contract Showcase -->
  <g transform="translate(456, 140)">
    
    <!-- Top Card: Dynamic Ceiling Progress Bar Card -->
    <g transform="translate(0, 0)">
      <rect width="688" height="156" rx="14" fill="url(#card-panel-grad)" stroke="#2b2d36" stroke-width="1.2"/>
      
      <!-- Card Header -->
      <g transform="translate(24, 20)">
        <text x="0" y="0" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="600">Google Colab 算力配额监控</text>
        <text x="0" y="18" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">OAuth2 PKCE 授权 · 智能动态阶梯天花板契约</text>
        <!-- Plan Badge -->
        <rect x="580" y="-12" width="60" height="22" rx="11" fill="#30d158" fill-opacity="0.15" stroke="#30d158" stroke-width="0.8" stroke-opacity="0.4"/>
        <text x="610" y="3" fill="#30d158" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Colab Pro</text>
      </g>

      <!-- Meter Progress Block -->
      <g transform="translate(24, 68)">
        <div style="display:flex;justify-content:space-between"></div>
        <text x="0" y="0" fill="#d2d2d7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500">付费 CCU 算力</text>
        <text x="640" y="0" fill="#f5f5f7" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="700" text-anchor="end">36.8 / 100 CCU <tspan fill="#30d158">(余 63.2)</tspan></text>
        
        <!-- Track Background -->
        <rect x="0" y="10" width="640" height="10" rx="5" fill="#24262e"/>
        <!-- Active Fill (36.8%) -->
        <rect x="0" y="10" width="235" height="10" rx="5" fill="#30d158"/>

        <!-- Status & Contract Hint Row -->
        <g transform="translate(0, 36)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">
          <circle cx="4" cy="-4" r="3" fill="#30d158"/>
          <text x="14" y="0" fill="#86868b">状态: 正常 (36.8% 已消耗)</text>
          <text x="640" y="0" fill="#2997ff" font-weight="500" text-anchor="end">月度配额: 100 CCU / 月 (90天有效)</text>
        </g>
      </g>
    </g>

    <!-- Bottom Card: Snapshot History Chart Preview Card -->
    <g transform="translate(0, 172)">
      <rect width="688" height="172" rx="14" fill="url(#card-panel-grad)" stroke="#2b2d36" stroke-width="1.2"/>

      <!-- Header with 7d/30d/90d switcher -->
      <g transform="translate(24, 20)">
        <text x="0" y="0" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600">CCU 算力余额快照历史趋势</text>
        <text x="0" y="16" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">SQLite 本地累积时间序列 · 每次配额刷新防抖快照</text>
        
        <!-- Period Switcher Pills -->
        <g transform="translate(510, -8)">
          <rect x="0" y="0" width="38" height="22" rx="6" fill="#20222a"/>
          <text x="19" y="15" fill="#86868b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">7天</text>
          
          <rect x="44" y="0" width="42" height="22" rx="6" fill="#2997ff"/>
          <text x="65" y="15" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" text-anchor="middle">30天</text>

          <rect x="92" y="0" width="38" height="22" rx="6" fill="#20222a"/>
          <text x="111" y="15" fill="#86868b" font-family="-apple-system, sans-serif" font-size="10" text-anchor="middle">90天</text>
        </g>
      </g>

      <!-- SVG Sparkline Chart Area -->
      <g transform="translate(24, 56)">
        <!-- Grid lines -->
        <line x1="0" y1="18" x2="640" y2="18" stroke="#252730" stroke-width="0.8" stroke-dasharray="2 3"/>
        <text x="-8" y="21" fill="#666666" font-family="'SF Mono', monospace" font-size="9" text-anchor="end">100</text>

        <line x1="0" y1="48" x2="640" y2="48" stroke="#252730" stroke-width="0.8" stroke-dasharray="2 3"/>
        <text x="-8" y="51" fill="#666666" font-family="'SF Mono', monospace" font-size="9" text-anchor="end">75</text>

        <line x1="0" y1="78" x2="640" y2="78" stroke="#252730" stroke-width="0.8" stroke-dasharray="2 3"/>
        <text x="-8" y="81" fill="#666666" font-family="'SF Mono', monospace" font-size="9" text-anchor="end">50</text>

        <!-- Balance curve (Paid CCU balance decreasing slightly over time) -->
        <path d="M 0 28 L 80 28 L 160 34 L 240 34 L 320 42 L 400 48 L 480 50 L 560 54 L 640 58" fill="none" stroke="#30d158" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Area fill -->
        <path d="M 0 28 L 80 28 L 160 34 L 240 34 L 320 42 L 400 48 L 480 50 L 560 54 L 640 58 L 640 96 L 0 96 Z" fill="#30d158" fill-opacity="0.08"/>

        <!-- Legend -->
        <g transform="translate(0, 106)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">
          <rect x="0" y="0" width="10" height="3" rx="1.5" fill="#30d158"/>
          <text x="16" y="5" fill="#86868b">付费 CCU 余额曲线</text>

          <rect x="130" y="0" width="10" height="3" rx="1.5" fill="#2997ff"/>
          <text x="146" y="5" fill="#86868b">免费额度 (mCCUs)</text>

          <text x="640" y="5" fill="#666666" font-size="10" text-anchor="end">最后更新: 刚刚 (63.16 CCU)</text>
        </g>
      </g>
    </g>

  </g>
</svg>
