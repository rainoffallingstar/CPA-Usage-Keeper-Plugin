<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Usage Keeper Logo</title>
  <desc id="logo-desc">Usage Keeper 标志 — Apple 风格的 AI 智能用量与成本精算中枢图标。</desc>

  <defs>
    <!-- App Icon Surface Gradient -->
    <linearGradient id="icon-surface-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Glowing Rim Top Light -->
    <linearGradient id="icon-rim-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#2997ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Core Accent Radiant Glow -->
    <radialGradient id="core-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2997ff" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#5856d6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="beam-blue-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="60%" stop-color="#5856d6"/>
      <stop offset="100%" stop-color="#af52de"/>
    </linearGradient>

    <linearGradient id="meter-green" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#30d158"/>
      <stop offset="100%" stop-color="#34c759"/>
    </linearGradient>

    <!-- Shadow filter for icon depth -->
    <filter id="icon-drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base with Apple Continuous Curvature (rx=56 on 256) -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#icon-surface-grad)" stroke="url(#icon-rim-grad)" stroke-width="2" filter="url(#icon-drop-shadow)"/>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#core-glow)"/>

  <!-- Telemetry Ring Buffer Rings (Outer & Inner concentric data circles) -->
  <g transform="translate(128, 128)">
    <!-- Outer Track -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#2c2c32" stroke-width="4"/>
    <!-- Outer Active Arc -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="url(#beam-blue-purple)" stroke-width="5" stroke-linecap="round" stroke-dasharray="320 480" stroke-dashoffset="-40"/>
    
    <!-- Middle Track -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#24242a" stroke-width="3" stroke-dasharray="4 6"/>
    <!-- Middle Active Pulse -->
    <circle cx="0" cy="0" r="56" fill="none" stroke="#30d158" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="140 360" stroke-dashoffset="60"/>

    <!-- Inner Core Vault Matrix -->
    <rect x="-38" y="-38" width="76" height="76" rx="20" fill="#18181c" stroke="#3a3a42" stroke-width="1.5"/>

    <!-- Central Trend & Token Sparks -->
    <!-- Rising Activity Curve -->
    <path d="M -24 16 L -10 6 L 4 12 L 20 -16 L 26 -12" fill="none" stroke="url(#beam-blue-purple)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Area Under Curve -->
    <path d="M -24 16 L -10 6 L 4 12 L 20 -16 L 26 -12 L 26 22 L -24 22 Z" fill="#2997ff" fill-opacity="0.15"/>

    <!-- Apex Metric Node -->
    <circle cx="20" cy="-16" r="4.5" fill="#ffffff" stroke="#2997ff" stroke-width="2.5"/>

    <!-- Small Satellites / Nodes -->
    <circle cx="-10" cy="6" r="2.5" fill="#2997ff"/>
    <circle cx="4" cy="12" r="2.5" fill="#5856d6"/>

    <!-- Peripheral Accent Dots (Live Telemetry Indicators) -->
    <circle cx="0" cy="-76" r="3.5" fill="#2997ff"/>
    <circle cx="76" cy="0" r="3" fill="#30d158"/>
    <circle cx="-54" cy="54" r="3" fill="#ffd60a"/>
  </g>
</svg>
