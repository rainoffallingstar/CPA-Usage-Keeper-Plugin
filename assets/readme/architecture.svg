<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Usage Keeper 架构图</title>
  <desc id="arch-desc">展示客户端请求如何通过 CPA 进程内 CGO Hook 零开销拦截、环形缓冲区异步落盘并呈现至 Web 仪表盘的架构全景。</desc>

  <defs>
    <linearGradient id="arch-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d0f"/>
      <stop offset="100%" stop-color="#121316"/>
    </linearGradient>
    <linearGradient id="node-active" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2230"/>
      <stop offset="100%" stop-color="#141824"/>
    </linearGradient>
    <linearGradient id="flow-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#7d7aff"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="280" rx="16" fill="url(#arch-bg)" stroke="#26262a" stroke-width="1.5"/>

  <!-- Section Title & Eyebrow -->
  <g transform="translate(48, 36)">
    <text x="0" y="0" fill="#2997ff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="700" letter-spacing="0.08em">IN-PROCESS ARCHITECTURE</text>
    <text x="0" y="24" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="20" font-weight="700">高性能进程内数据流转机制</text>
  </g>

  <!-- Pipeline Nodes Flow -->
  <g transform="translate(48, 88)">
    
    <!-- Node 1: AI Clients -->
    <g transform="translate(0, 0)">
      <rect width="180" height="140" rx="12" fill="#18181c" stroke="#2e2e34" stroke-width="1.2"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#2997ff" fill-opacity="0.15"/>
      <!-- Client Icon -->
      <path d="M 22 28 L 34 28 M 28 22 L 28 34" stroke="#2997ff" stroke-width="2" stroke-linecap="round"/>
      <text x="50" y="27" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600">AI 客户端</text>
      <text x="50" y="41" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">Clients</text>

      <line x1="14" y1="52" x2="166" y2="52" stroke="#26262a"/>
      <text x="14" y="74" fill="#d2d2d7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">• Cursor / Claude Code</text>
      <text x="14" y="94" fill="#d2d2d7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">• CodeGate / Codex</text>
      <text x="14" y="114" fill="#d2d2d7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">• 业务原生 API 请求</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <path d="M 180 70 L 228 70" fill="none" stroke="url(#flow-line)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="228,66 236,70 228,74" fill="#7d7aff"/>

    <!-- Node 2: CPA Host -->
    <g transform="translate(236, 0)">
      <rect width="190" height="140" rx="12" fill="#18181c" stroke="#2e2e34" stroke-width="1.2"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#5856d6" fill-opacity="0.15"/>
      <text x="50" y="27" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="600">CLIProxyAPI</text>
      <text x="50" y="41" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">宿主进程 (CPA Host)</text>

      <line x1="14" y1="52" x2="176" y2="52" stroke="#26262a"/>
      <text x="14" y="74" fill="#d2d2d7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">• 智能模型代理转发</text>
      <text x="14" y="94" fill="#d2d2d7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">• 路由 &amp; 凭据负载均衡</text>
      <text x="14" y="114" fill="#d2d2d7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">• Usage Hook 回调触发</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <path d="M 426 70 L 474 70" fill="none" stroke="url(#flow-line)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="474,66 482,70 474,74" fill="#7d7aff"/>

    <!-- Node 3: Usage Keeper Core (Highlighted) -->
    <g transform="translate(482, 0)">
      <rect width="260" height="140" rx="12" fill="url(#node-active)" stroke="#2997ff" stroke-width="1.8"/>
      <rect x="14" y="14" width="28" height="28" rx="8" fill="#2997ff"/>
      <text x="28" y="32" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">⚡</text>
      <text x="50" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="700">Usage Keeper 插件</text>
      <text x="50" y="41" fill="#2997ff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500">CGO 进程内共享内存拦截</text>

      <line x1="14" y1="52" x2="246" y2="52" stroke="#2b3850"/>
      <text x="14" y="74" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">✓ 无锁环形缓冲区 (Ring Buffer)</text>
      <text x="14" y="94" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">✓ SHA-224 API Key 脱敏存储</text>
      <text x="14" y="114" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">✓ 650+ 模型定价模糊变体匹配</text>
    </g>

    <!-- Branching Connectors 3 -> 4A & 4B -->
    <path d="M 742 70 L 780 70 L 780 34 L 818 34" fill="none" stroke="#2997ff" stroke-width="2" stroke-linecap="round"/>
    <polygon points="818,30 826,34 818,38" fill="#2997ff"/>

    <path d="M 742 70 L 780 70 L 780 106 L 818 106" fill="none" stroke="#30d158" stroke-width="2" stroke-linecap="round"/>
    <polygon points="818,102 826,106 818,110" fill="#30d158"/>

    <!-- Target Node 4A: SQLite Persistence -->
    <g transform="translate(826, 6)">
      <rect width="278" height="58" rx="10" fill="#18181c" stroke="#2e2e34" stroke-width="1.2"/>
      <rect x="10" y="12" width="34" height="34" rx="7" fill="#2997ff" fill-opacity="0.12"/>
      <text x="27" y="34" fill="#2997ff" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">💾</text>
      <text x="52" y="27" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600">SQLite 3-Conn 异步事务落盘</text>
      <text x="52" y="44" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">Canonical DB 无损升级软链 · 112M+ 容灾</text>
    </g>

    <!-- Target Node 4B: Apple Web Dashboard -->
    <g transform="translate(826, 76)">
      <rect width="278" height="58" rx="10" fill="#18181c" stroke="#2e2e34" stroke-width="1.2"/>
      <rect x="10" y="12" width="34" height="34" rx="7" fill="#30d158" fill-opacity="0.12"/>
      <text x="27" y="34" fill="#30d158" font-family="-apple-system, sans-serif" font-size="14" text-anchor="middle">🍏</text>
      <text x="52" y="27" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="600">Apple Web Dashboard &amp; APIs</text>
      <text x="52" y="44" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11">Overview 看板 / 配额监控 / 定价管理 / 抽屉</text>
    </g>
  </g>
</svg>
