# =============================================================================
# CPA Plugin: Usage Keeper (cpa-plugin-usage-keeper)
# =============================================================================
# 
# This plugin runs inside the CPA process and:
# 1. Receives every completed request's usage data (tokens, latency, model, auth, etc.)
#    via the CPA UsagePlugin capability — no external polling needed.
# 2. Stores usage events persistently in an embedded SQLite database.
# 3. Exposes a browser dashboard at /v0/resource/plugins/usage-keeper/dashboard
#    with real-time usage stats, model breakdowns, and event history.
# 4. Exposes a Quotio-compatible GET /v0/management/usage endpoint aggregating all stored usage data.
# 5. Exposes JSON API endpoints under /v0/resource/plugins/usage-keeper/api/ for dashboard consumption.
#
# Installation:
#   1. Build:  cd cpa-plugin-usage-keeper && make build
#   2. Deploy: Copy dist/usage-keeper.dylib (or .so/.dll) to CPA's plugins/<GOOS>/<GOARCH>/
#   3. Enable in CPA config as shown below.
#
# =============================================================================

plugins:
  enabled: true
  dir: "./plugins"

  configs:
    usage-keeper:
      enabled: true
      priority: 1

      # -----------------------------------------------------------------------
      # db_path — Path to the SQLite database file for persistent usage storage.
      # Default: "usage-keeper.db" (relative to CPA working directory).
      # -----------------------------------------------------------------------
      db_path: "./data/usage-keeper.db"

      # -----------------------------------------------------------------------
      # retention_days — Number of days to retain usage records before automatic
      # cleanup. Records older than this are deleted when the plugin processes
      # every ~100th usage event.
      # Default: 90
      # -----------------------------------------------------------------------
      retention_days: 90

      # -----------------------------------------------------------------------
      # refresh_seconds — Dashboard auto-refresh interval in seconds.
      # Valid range: 0–3600 (0 = off). The dashboard also has a dropdown to change this at runtime.
      # Default: 0 (auto-refresh disabled)
      # -----------------------------------------------------------------------
      refresh_seconds: 0

      # -----------------------------------------------------------------------
      # write_batch_size — Usage events committed in each SQLite transaction.
      # Valid range: 1–1000. Larger batches reduce WAL write frequency.
      # Default: 100
      # -----------------------------------------------------------------------
      write_batch_size: 100

      # -----------------------------------------------------------------------
      # write_flush_seconds — Maximum time an incomplete batch remains in memory.
      # Valid range: 1–300 seconds.
      # Default: 10
      # -----------------------------------------------------------------------
      write_flush_seconds: 10

      # -----------------------------------------------------------------------
      # unpriced_ignore_models — 豁免「未定价」健康告警的模型名（可选）。
      # 用于包月订阅 / 占位模型名（如 cursor/default）：这类模型按订阅计费、
      # 没有 token 单价，上游价格源不会有条目，不应计入 models_without_price。
      # 支持 YAML 列表或逗号分隔字符串。
      # 内置已豁免：cursor/default，以及任意 */default、*/auto、*/unknown 占位名。
      # -----------------------------------------------------------------------
      # unpriced_ignore_models:
      #   - "cursor/default"
      #   - "some-provider/default"

      # -----------------------------------------------------------------------
      # ollama_accounts — Ollama Cloud 账号（可选，也可在 Dashboard 中直接添加）。
      # 每个账号通过 session_cookie 抓取 https://ollama.com/settings 页面，
      # 解析 "Cloud usage" 区块中的 Session / Weekly 用量。
      #   name           — 展示名称
      #   session_cookie — 登录 Cookie（"aid=...; __Secure-session=..."）
      #   show_session   — 是否显示 Session 额度（默认 true）
      #   show_weekly    — 是否显示周额度（默认 true）
      # -----------------------------------------------------------------------
      # ollama_accounts:
      #   - name: "我的 Ollama 账号"
      #     session_cookie: "aid=YOUR_AID; __Secure-session=YOUR_SESSION_VALUE"
      #     show_session: true
      #     show_weekly: true

      # -----------------------------------------------------------------------
      # newapi_accounts — NewAPI 兼容面板（如 dddai.dev）的钱包 + 订阅额度（可选，
      # 也可在 Dashboard 的「NewAPI / dddai」页签中直接添加）。
      # 使用面板「访问令牌」(nap_...)，不是 sk- 模型密钥。
      # 只调用官方 new-api 通用自助接口：
      #   /api/status（公开）+ /api/user/self（profile:read）
      #   + /api/subscription/self、/api/subscription/plans（wallet:read）
      #   + /api/log/self/stat（usage:read）
      # 因此令牌需要 profile:read / wallet:read / usage:read 三项只读权限。
      # 若要查看 API Key 列表（仅名称与用量），还需 api_key:read。
      # 插件绝不读取/展示 Key 明文，也不调用任何 reveal 接口。
      # 同一用户存在多个订阅时，每个订阅按所属分组独立展示（额度不互通）。
      #   name     — 展示名称
      #   base_url — 面板根地址（默认 https://dddai.dev；会自动去掉 /api、/v1 后缀）
      #   token    — 面板访问令牌；需具备钱包/订阅/用量读取权限
      # 令牌落库时做轻量混淆（与 Colab refresh token 相同），不会明文存储。
      # -----------------------------------------------------------------------
      # newapi_accounts:
      #   - name: "dddai 自用"
      #     base_url: "https://dddai.dev"
      #     token: "nap_..."
